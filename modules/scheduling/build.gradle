plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.107'
    id 'com.gradleup.shadow' version '9.0.2'
    id 'idea'
    id 'builder.kasuga.generator'
    id 'builder.kasuga.monorepo'
}

version = mod_version
group = mod_group_id

useGenerator(project)
// The mod entry point (@Mod KuaYue + its Micronaut @Context applications) lives in :modules:core.
// Without this the module starts with no KuaYue context at all, so no @Context bean ever runs.
useModProject(project(":modules:core"))
// Same declaration as core: this is what actually puts a module's compiled output on the kuayue module
// path. `mods { sourceSet(...) }` alone does not, which is why the part blocks were never registered.
useModProject(project(":modules:train-parts"))

var find = gradle.getIncludedBuilds()*.any {
    it.name == "KasugaLibNext"
}.contains(true)

ext.useBundle = { dependency ->
    if(find) {
        dependency.attributes {
            attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.SHADOWED))
        }
    }
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
    maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
    maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
    // LDLib2
    maven { url = "https://maven.firstdark.dev/snapshots" }
}

base {
    archivesName = mod_id
}

/** Jar files unpacked from LDLib2's jarjar payloads. Resolved lazily: empty before extraction runs. */
def ldlib2NestedFiles(dirProvider) {
    def dir = dirProvider.get().asFile
    def entries = dir.listFiles()
    if (entries == null) return new java.util.LinkedHashSet<java.io.File>()
    return entries.findAll { it.name.endsWith('.jar') }.toSet()
}


configurations {
    shadowLibrary
    implementation.extendsFrom shadowLibrary
    // Isolated handle on the LDLib2 artifact, used only to unpack its nested layout-engine jars.
    ldlib2Runtime {
        canBeConsumed = false
        canBeResolved = true
    }
}

test {
    useJUnitPlatform()
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            // Inlcude the core subproject as a dependency.
            sourceSet(sourceSets.main)
            // train-parts joins this mod through useModProject above; declaring its source set here as
            // well makes moddev report "Duplicate source set 'main' in mod 'kuayue'".
        }
    }
}


configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// The part module is already part of this mod through `mods { }`, which merges its source set into the
// kuayue module. Adding it to the runtime classpath as well put the same classes on two module paths and
// the launcher refused to start ("Module minecraft reads more than one module named kuayue"), so the only
// thing needed here is the build order.
tasks.matching { it.name == "runClient" }.configureEach {
    dependsOn(":modules:train-parts:classes", ":modules:train-parts:processResources")
}

dependencies {
    implementation (project(":modules:core"))
    implementation (project(":modules:train-parts"))

    implementation ("io.micronaut:micronaut-inject:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    additionalRuntimeClasspath ("io.micronaut:micronaut-inject:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    additionalRuntimeClasspath ("io.micronaut:micronaut-aop:4.9.10") {
        exclude group : 'org.slf4j', module: 'slf4j-api'
    }

    annotationProcessor 'io.micronaut:micronaut-inject-java:4.9.10'

    implementation("lib.kasuga:kasuga_lib:1.0.0") {
        useBundle(delegate)
    }
    // kasuga_lib already shades the utils module, while kasuga-inject pulls kasuga-utils in as its own
    // mod jar. Two modules exporting lib.kasuga.utils aborts mod loading with a ResolutionException,
    // so keep it off the runtime classpath (compile still sees the classes through kasuga_lib).
    implementation "lib.kasuga:inject:1.0.0"


    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    implementation("net.createmod.ponder:Ponder-NeoForge-${minecraft_version}:${ponder_version}")
    compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
    runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
    implementation("com.tterrag.registrate:Registrate:${registrate_version}")

    implementation("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all") { transitive = false }
    ldlib2Runtime("com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all") { transitive = false }

    // LDLib2 ships taffy/yoga as jarjar payloads. Declaration order matters here: the extraction
    // task is created first, then the unpacked jars are added lazily (their folder does not exist yet
    // on a clean checkout), then compileJava depends on that task.
    def ldlib2NestedDir = layout.buildDirectory.dir("ldlib2-nested")
    def ldlib2AllJar = file(configurations.getByName("ldlib2Runtime").files.find {
        it.name.startsWith("ldlib2-neoforge-") && it.name.endsWith("-all.jar")
    })
    def ldlib2UnzipTask = tasks.register("extractLdlib2Nested", Copy) {
        from({ zipTree(ldlib2AllJar) }) {
            include 'META-INF/jarjar/*.jar'
            eachFile { it.path = it.name }
            includeEmptyDirs = false
        }
        into(ldlib2NestedDir)
    }
    // The unpacked jars must be on the compile classpath. fileTree covers a clean build because the
    // jar files are produced by extractLdlib2Nested before compileJava runs.
    compileOnly(fileTree(ldlib2NestedDir) { include '*.jar' })
    compileJava.dependsOn(ldlib2UnzipTask)

    // kasuga-inject 把 :modules:utils 作为 includeBuild 项目依赖带进运行时，而 kasuga_lib 的 shadow jar
    // 已经包含同一批 lib.kasuga.utils 类。两个模块导出同一个包会让 JPMS 在启动阶段直接抛
    // ResolutionException（mod 还没开始加载），所以把独立的 utils jar 从运行时类路径剔除。
    // 项目依赖不吃 component exclude，只能按产物文件名过滤。
    configurations.matching { it.name.startsWith("runtimeClasspath") || it.name == "additionalRuntimeClasspath" }.configureEach { cfg ->
        cfg.exclude group: 'lib.kasuga', module: 'utils'
    }




    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'


    compileOnly("org.projectlombok:lombok:1.18.42")
    annotationProcessor("org.projectlombok:lombok:1.18.42")
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}
